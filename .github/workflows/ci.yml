name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee /tmp/go-test.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "${status}" -eq 0 ]; then
            result="success"
          else
            result="failure"
          fi

          {
            echo "## 持续集成 / CI"
            echo
            echo "- 结果 / Result: \`${result}\`"
            echo "- 分支 / Branch: \`${GITHUB_REF_NAME}\`"
            echo "- 提交 / Commit: \`${GITHUB_SHA}\`"
            echo "- Go 版本 / Go version: \`$(go version)\`"
            echo "- 测试命令 / Test command: \`go test ./...\`"
            echo "- 职责 / Responsibility: program tests only"
            echo "- 覆盖范围 / Scope: all Go packages under this repository"
            echo
            echo "<details><summary>测试日志 / go test output</summary>"
            echo
            echo '```text'
            cat /tmp/go-test.log
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${status}"
