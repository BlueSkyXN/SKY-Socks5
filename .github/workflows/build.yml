name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail

          ref_name="${GITHUB_REF_NAME//\//-}"
          build_label="${ref_name}-${GITHUB_SHA:0:7}"

          rm -rf dist
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"${target}"
            archive="sky-socks5_${build_label}_${goos}_${goarch}"

            if [ "${goos}" = "windows" ]; then
              GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/sky-socks5.exe .
              (
                cd dist
                zip -q "${archive}.zip" sky-socks5.exe
              )
              rm -f dist/sky-socks5.exe
              continue
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/sky-socks5 .
            tar -C dist -czf "dist/${archive}.tar.gz" sky-socks5
            rm -f dist/sky-socks5
          done

      - name: Summarize build artifacts
        shell: bash
        run: |
          {
            echo "## 构建 / Build"
            echo
            echo "- 分支 / Branch: \`${GITHUB_REF_NAME}\`"
            echo "- 提交 / Commit: \`${GITHUB_SHA}\`"
            echo "- 输出目录 / Output directory: \`dist/\`"
            echo "- 发布 Release / Publish release: \`false\`"
            echo "- 构建平台 / Targets: Linux amd64/arm64, macOS amd64/arm64, Windows amd64"
            echo
            echo "| 构建产物 / Asset | 大小 / Size |"
            echo "| --- | ---: |"
            while IFS= read -r asset; do
              size=$(du -h "${asset}" | awk '{print $1}')
              echo "| \`${asset#dist/}\` | ${size} |"
            done < <(find dist -type f | sort)
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifacts-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
