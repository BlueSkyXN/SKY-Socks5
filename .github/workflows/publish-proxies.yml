name: Publish Proxy Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: publish-proxies
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate proxy artifacts
        run: |
          rm -rf generated
          go run ./cmd/sky-socks5 -output-dir generated

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-artifacts
          path: generated/
          if-no-files-found: error
