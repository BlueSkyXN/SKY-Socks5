name: Proxy Results

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Optional single source URL for testing one upstream; leave empty to use configs/sources.txt
        required: false
        default: ""
      fetch_timeout:
        description: Timeout for fetching each source list
        required: true
        default: 15s
      validate_timeout:
        description: Per-proxy validation timeout
        required: true
        default: 10s
      validate_concurrency:
        description: Maximum validation workers
        required: true
        default: "100"

permissions:
  contents: read

concurrency:
  group: proxy-results
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate proxy results
        id: generate
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FETCH_TIMEOUT: ${{ inputs.fetch_timeout }}
          VALIDATE_TIMEOUT: ${{ inputs.validate_timeout }}
          VALIDATE_CONCURRENCY: ${{ inputs.validate_concurrency }}
        run: |
          set -euo pipefail

          rm -rf generated
          args=(
            -output-dir generated
            -fetch-timeout "${FETCH_TIMEOUT}"
            -validate-timeout "${VALIDATE_TIMEOUT}"
            -validate-concurrency "${VALIDATE_CONCURRENCY}"
          )

          if [ -n "${SOURCE_URL}" ]; then
            printf '%s\n' "${SOURCE_URL}" > /tmp/sky-socks5-sources.txt
            args+=(-source-file /tmp/sky-socks5-sources.txt)
          fi

          go run . "${args[@]}"

      - name: Summarize proxy results
        if: always()
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FETCH_TIMEOUT: ${{ inputs.fetch_timeout }}
          VALIDATE_TIMEOUT: ${{ inputs.validate_timeout }}
          VALIDATE_CONCURRENCY: ${{ inputs.validate_concurrency }}
        run: |
          {
            echo "## Proxy Results"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Output directory: \`generated/\`"
            if [ -n "${SOURCE_URL}" ]; then
              echo "- Source mode: \`single-source smoke run\`"
              echo "- Source URL: \`${SOURCE_URL}\`"
              echo "- Default source file: \`configs/sources.txt\` (not used for this smoke run)"
            else
              echo "- Source mode: \`configured aggregate list\`"
              echo "- Source file: \`configs/sources.txt\`"
            fi
            echo "- Fetch timeout: \`${FETCH_TIMEOUT}\`"
            echo "- Validate timeout: \`${VALIDATE_TIMEOUT}\`"
            echo "- Validate concurrency: \`${VALIDATE_CONCURRENCY}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -f generated/proxy_report.json ]; then
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          report = json.loads(Path("generated/proxy_report.json").read_text())
          totals = report["totals"]
          print(f"- Sources: {totals['source_urls']}")
          print(f"- Fetch errors: {totals['fetch_errors']}")
          print(f"- Raw candidates: {totals['raw_candidates']}")
          print(f"- Parsed proxies: {totals['parsed_proxies']}")
          print(f"- Unique proxies: {totals['unique_proxies']}")
          print(f"- Valid proxies: {totals['valid_proxies']}")
          print(f"- Invalid proxies: {totals['invalid_proxies']}")
          print()
          print("| File | Lines |")
          print("| --- | ---: |")
          for name in ["raw_proxies.txt", "unique_proxies.txt", "validated_proxies.txt"]:
              path = Path("generated") / name
              if path.exists():
                  count = len(path.read_text().splitlines())
                  print(f"| `{name}` | {count} |")
          print("| `proxy_report.json` | 1 |")
          PY
          else
            {
              echo
              echo "Generation did not produce \`generated/proxy_report.json\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload proxy results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: proxy-results-${{ github.run_id }}
          path: generated/
          if-no-files-found: error
          retention-days: 14
