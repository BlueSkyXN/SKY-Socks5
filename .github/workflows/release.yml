name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v0.1.0
      publish:
        description: Publish GitHub release after building
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "${tag}" ] || [[ "${tag}" != v* ]]; then
            echo "Release tag must start with v" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee /tmp/release-go-test.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "${status}" -eq 0 ]; then
            result="success"
          else
            result="failure"
          fi

          {
            echo "## Release Tests"
            echo
            echo "- Result: ${result}"
            echo "- Release tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Command: \`go test ./...\`"
            echo
            echo "<details><summary>go test output</summary>"
            echo
            echo '```text'
            cat /tmp/release-go-test.log
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${status}"

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ steps.release.outputs.tag }}"
          rm -rf dist
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"${target}"
            archive="sky-socks5_${release_tag}_${goos}_${goarch}"

            if [ "${goos}" = "windows" ]; then
              GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/sky-socks5.exe .
              (
                cd dist
                zip -q "${archive}.zip" sky-socks5.exe
              )
              rm -f dist/sky-socks5.exe
              continue
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/sky-socks5 .
            tar -C dist -czf "dist/${archive}.tar.gz" sky-socks5
            rm -f dist/sky-socks5
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Summarize release assets
        shell: bash
        run: |
          {
            echo "## Release Assets"
            echo
            echo "- Release tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Publish release: \`${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}\`"
            echo
            echo "| Asset | Size |"
            echo "| --- | ---: |"
            while IFS= read -r asset; do
              size=$(du -h "${asset}" | awk '{print $1}')
              echo "| \`${asset#dist/}\` | ${size} |"
            done < <(find dist -type f | sort)
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
