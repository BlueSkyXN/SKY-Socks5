name: CD

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Optional single source URL for testing one upstream; leave empty to use configs/sources.txt
        required: false
        default: ""
      fetch_timeout:
        description: Timeout for fetching each source list
        required: true
        default: 15s
      probe_url:
        description: Probe URL used through each SOCKS5 proxy
        required: true
        default: https://www.cloudflare.com/cdn-cgi/trace
      valid_statuses:
        description: Comma-separated HTTP statuses accepted during validation
        required: true
        default: "200"
      validate_timeout:
        description: Per-proxy validation timeout
        required: true
        default: 10s
      validate_concurrency:
        description: Maximum validation workers
        required: true
        default: "100"

permissions:
  contents: read

concurrency:
  group: cd-proxy-validation
  cancel-in-progress: true

jobs:
  proxy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run proxy validation
        id: generate
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FETCH_TIMEOUT: ${{ inputs.fetch_timeout }}
          PROBE_URL: ${{ inputs.probe_url }}
          VALID_STATUSES: ${{ inputs.valid_statuses }}
          VALIDATE_TIMEOUT: ${{ inputs.validate_timeout }}
          VALIDATE_CONCURRENCY: ${{ inputs.validate_concurrency }}
        run: |
          set -euo pipefail

          rm -rf generated
          args=(
            -output-dir generated
            -fetch-timeout "${FETCH_TIMEOUT}"
            -probe-url "${PROBE_URL}"
            -valid-statuses "${VALID_STATUSES}"
            -validate-timeout "${VALIDATE_TIMEOUT}"
            -validate-concurrency "${VALIDATE_CONCURRENCY}"
          )

          if [ -n "${SOURCE_URL}" ]; then
            printf '%s\n' "${SOURCE_URL}" > /tmp/sky-socks5-sources.txt
            args+=(-source-file /tmp/sky-socks5-sources.txt)
          fi

          go run . "${args[@]}"

      - name: Summarize CD proxy validation
        if: always()
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FETCH_TIMEOUT: ${{ inputs.fetch_timeout }}
          PROBE_URL: ${{ inputs.probe_url }}
          VALID_STATUSES: ${{ inputs.valid_statuses }}
          VALIDATE_TIMEOUT: ${{ inputs.validate_timeout }}
          VALIDATE_CONCURRENCY: ${{ inputs.validate_concurrency }}
        run: |
          {
            echo "## 持续交付代理评测 / CD Proxy Validation"
            echo
            echo "- 分支 / Branch: \`${GITHUB_REF_NAME}\`"
            echo "- 提交 / Commit: \`${GITHUB_SHA}\`"
            echo "- 输出目录 / Output directory: \`generated/\`"
            echo "- 职责 / Responsibility: run proxy validation in GitHub Actions environment and upload result artifacts"
            if [ -n "${SOURCE_URL}" ]; then
              echo "- 数据源模式 / Source mode: \`single-source smoke run\`"
              echo "- 数据源 URL / Source URL: \`${SOURCE_URL}\`"
              echo "- 默认聚合源文件 / Default source file: \`configs/sources.txt\` (not used for this smoke run)"
            else
              echo "- 数据源模式 / Source mode: \`configured aggregate list\`"
              echo "- 数据源文件 / Source file: \`configs/sources.txt\`"
            fi
            echo "- 探测 URL / Probe URL: \`${PROBE_URL}\`"
            echo "- 有效状态码 / Valid statuses: \`${VALID_STATUSES}\`"
            echo "- 抓取超时 / Fetch timeout: \`${FETCH_TIMEOUT}\`"
            echo "- 验证超时 / Validate timeout: \`${VALIDATE_TIMEOUT}\`"
            echo "- 验证并发 / Validate concurrency: \`${VALIDATE_CONCURRENCY}\`"
            echo "- 有效性口径 / Validation policy: SOCKS5 proxy must complete an HTTP GET to the probe URL and return an accepted status."
            echo "- 主 CSV 字段 / Main CSV fields: entry/source metadata, exit IP/country, Cloudflare colo/http/flags, status, timing, validation settings."
            echo "- Cloudflare flags: only non-default \`warp\`, \`gateway\`, or \`rbi\` values are surfaced in the CSV."
            echo "- 完整 Trace / Full trace: raw Cloudflare key/value data, including diagnostic fields such as \`tls\`, \`sni\`, and \`kex\`, is preserved in \`proxy_report.json\`."
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ -f generated/proxy_report.json ]; then
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path("generated/proxy_report.json").read_text())
          totals = report["totals"]

          def md(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          def percent(part, whole):
              if not whole:
                  return "0.00%"
              return f"{part / whole * 100:.2f}%"

          def top_items(counter, limit=8):
              if not counter:
                  return "none"
              return ", ".join(f"{key}:{value}" for key, value in counter.most_common(limit))

          def percentile(values, ratio):
              if not values:
                  return ""
              index = int(round((len(values) - 1) * ratio))
              return values[index]

          print()
          print("| 指标 / Metric | 数值 / Value |")
          print("| --- | ---: |")
          rows = [
              ("数据源数量 / Sources", totals["source_urls"]),
              ("抓取错误 / Fetch errors", totals["fetch_errors"]),
              ("原始候选 / Raw candidates", totals["raw_candidates"]),
              ("解析成功 / Parsed proxies", totals["parsed_proxies"]),
              ("解析错误 / Parse errors", totals["parse_errors"]),
              ("去重后 / Unique proxies", totals["unique_proxies"]),
              ("有效代理 / Valid proxies", totals["valid_proxies"]),
              ("无效代理 / Invalid proxies", totals["invalid_proxies"]),
          ]
          for label, value in rows:
              print(f"| {label} | {value} |")

          print()
          print("| 文件 / File | 行数 / Lines |")
          print("| --- | ---: |")
          for name in ["raw_proxies.txt", "unique_proxies.txt", "validated_proxies.txt", "validated_proxies.csv"]:
              path = Path("generated") / name
              if path.exists():
                  count = len(path.read_text().splitlines())
                  print(f"| `{name}` | {count} |")
          print("| `proxy_report.json` | 1 |")

          records = report.get("validated_proxies") or []
          exit_countries = Counter()
          colos = Counter()
          match_counts = Counter()
          same_ip_counts = Counter()
          flag_counts = Counter()
          durations = []
          for record in records:
              exit_countries[record.get("exit_country") or "unknown"] += 1
              colos[record.get("cloudflare_colo") or "unknown"] += 1
              match_counts[record.get("source_country_matches_exit") or "unknown"] += 1
              same_ip_counts[str(record.get("entry_exit_same_ip", False)).lower()] += 1
              for flag in record.get("cloudflare_flags") or []:
                  flag_counts[flag] += 1
              duration = record.get("duration_ms")
              if isinstance(duration, int):
                  durations.append(duration)
          durations.sort()

          print()
          print("| 结果解读 / Result signal | 数值 / Value |")
          print("| --- | --- |")
          print(f"| 有效率 / Valid rate | {percent(totals['valid_proxies'], totals['unique_proxies'])} |")
          print(f"| 出口国家 Top / Exit countries | {md(top_items(exit_countries))} |")
          print(f"| Cloudflare 机房 Top / Cloudflare colo | {md(top_items(colos))} |")
          print(f"| 来源国家匹配 / Source country match | {md(top_items(match_counts))} |")
          print(f"| 入口出口同 IP / Entry and exit same IP | {md(top_items(same_ip_counts))} |")
          if durations:
              print(f"| 耗时 / Duration ms | min:{durations[0]}, p50:{percentile(durations, 0.50)}, p95:{percentile(durations, 0.95)}, max:{durations[-1]} |")
          else:
              print("| 耗时 / Duration ms | none |")
          print(f"| Cloudflare flags | {md(top_items(flag_counts))} |")

          print()
          print("| 数据源 / Source | 状态 / Status | 候选 / Candidates | 接受 / Accepted | 去重 / Unique | 有效 / Valid | 有效率 / Valid rate | 错误 / Error |")
          print("| --- | ---: | ---: | ---: | ---: | ---: | ---: | --- |")
          for source in report["sources"]:
              status = source.get("status_code", "")
              error = source.get("error", "")
              unique = source.get("unique_proxies", 0)
              valid = source.get("valid_proxies", 0)
              url = source["url"]
              if len(url) > 96:
                  url = url[:93] + "..."
              print(f"| `{md(url)}` | {status} | {source['candidates']} | {source['accepted']} | {unique} | {valid} | {percent(valid, unique)} | {md(error)} |")
          PY
          else
            {
              echo
              echo "未生成报告 / Generation did not produce \`generated/proxy_report.json\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload CD proxy validation results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cd-proxy-results-${{ github.run_id }}
          path: generated/
          if-no-files-found: error
          retention-days: 14
